name: Run Social Media Agent

on:
  schedule:
    # Run hourly to check python scheduler for matches
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      force_publish:
        description: 'Force Enable Publishing (overrides branch check)'
        required: false
        type: boolean
        default: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --no-cache-dir -r requirements.txt || {
          echo "First install attempt failed, retrying with verbose output..."
          pip install -v -r requirements.txt
        }

    - name: Run Database Migration
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python migrate_database.py || echo "Migration failed, but proceeding..."

    - name: Debug Configuration
      env:
        # API Keys from GitHub Secrets
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        
        # YouTube Credentials
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        
        # Facebook & Instagram Credentials
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        
        # Cloudinary Credentials (For stable Instagram posting)
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        
        # Database
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

        # LLM Configuration
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        
        # Google Drive Assets
        DRIVE_AUDIO_FOLDER_ID: ${{ secrets.DRIVE_AUDIO_FOLDER_ID }}
        DRIVE_BACKGROUNDS_FOLDER_ID: ${{ secrets.DRIVE_BACKGROUNDS_FOLDER_ID }}
        
        # --- BRANCH-BASED PUBLISHING TOGGLES ---
        # Allow Force Publish via Manual Trigger OR Main Branch
        ENABLE_PUBLISH_YOUTUBE: ${{ ((github.ref == 'refs/heads/main' || inputs.force_publish) && 'true') || 'false' }}
        ENABLE_PUBLISH_INSTAGRAM: ${{ ((github.ref == 'refs/heads/main' || inputs.force_publish) && 'true') || 'false' }}
        ENABLE_PUBLISH_FACEBOOK: ${{ ((github.ref == 'refs/heads/main' || inputs.force_publish) && 'true') || 'false' }}
        
        # Configuration
        TIMEZONE: "Asia/Kolkata"
        LOG_LEVEL: "INFO"
        
      run: |
        echo "🔍 Configuration Debug Information:"
        echo "Branch: ${{ github.ref }}"
        echo "Force Publish Input: ${{ inputs.force_publish }}"
        echo "ENABLE_PUBLISH_YOUTUBE: $ENABLE_PUBLISH_YOUTUBE"
        echo "ENABLE_PUBLISH_INSTAGRAM: $ENABLE_PUBLISH_INSTAGRAM"
        echo "ENABLE_PUBLISH_FACEBOOK: $ENABLE_PUBLISH_FACEBOOK"
        python debug_config.py

    - name: Execute Automated Pipeline
      env:
        # API Keys from GitHub Secrets
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        
        # YouTube Credentials
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        
        # Facebook & Instagram Credentials
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

        # Cloudinary Credentials (For stable Instagram posting)
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        
        # Database
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

        # LLM Configuration
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        
        # Google Drive Assets
        DRIVE_AUDIO_FOLDER_ID: ${{ secrets.DRIVE_AUDIO_FOLDER_ID }}
        DRIVE_BACKGROUNDS_FOLDER_ID: ${{ secrets.DRIVE_BACKGROUNDS_FOLDER_ID }}
        
        # --- BRANCH-BASED PUBLISHING TOGGLES ---
        # Allow Force Publish via Manual Trigger OR Main Branch
        ENABLE_PUBLISH_YOUTUBE: ${{ ((github.ref == 'refs/heads/main' || inputs.force_publish) && 'true') || 'false' }}
        ENABLE_PUBLISH_INSTAGRAM: ${{ ((github.ref == 'refs/heads/main' || inputs.force_publish) && 'true') || 'false' }}
        ENABLE_PUBLISH_FACEBOOK: ${{ ((github.ref == 'refs/heads/main' || inputs.force_publish) && 'true') || 'false' }}
        
        # Configuration
        TIMEZONE: "Asia/Kolkata"
        LOG_LEVEL: "INFO"
        
      run: |
        echo "🚀 Starting Viral Scheduler Check..."
        python scheduler_viral.py --cron
        
        echo "🚀 Starting Bulletin Scheduler Check..."
        # This checks the Python file 'scheduler_bulletin.py' for times
        # If the current hour matches X, Y, Z defined in that file, it runs.
        python scheduler_bulletin.py --cron

    - name: Upload Generated Videos and Logs
      if: always()  # Run even if previous steps fail
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-outputs-${{ github.run_id }}
        path: |
          output/videos/*.mp4
          logs/*.log
          PIPELINE_STATUS.md
        retention-days: 7

    - name: Send Email Alert on Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ Social Media Agent Pipeline Failed"
        to: ${{ secrets.EMAIL_TO }}
        from: Social Media Agent
        body: |
          The Social Media Agent pipeline failed.
          
          Run ID: ${{ github.run_id }}
          Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Please check the logs for more details.
