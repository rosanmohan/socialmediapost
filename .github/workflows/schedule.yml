name: Run Social Media Agent

on:
  schedule:
    # Runs at :30 past every hour to cover all 12 niche slots + 5 bulletin slots
    - cron: '30 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --no-cache-dir -r requirements.txt || {
          echo "First install attempt failed, retrying with verbose output..."
          pip install -v -r requirements.txt
        }

    - name: Run Database Migration
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python migrate_database.py || echo "Migration failed, but proceeding..."

    - name: Debug Configuration
      env:
        # API Keys from GitHub Secrets
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        
        # YouTube Credentials
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        
        # Facebook & Instagram Credentials
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

        # Cloudinary Credentials (For stable Instagram posting)
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        
        # Database
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

        # LLM Configuration
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        
        # Google Drive Assets
        DRIVE_AUDIO_FOLDER_ID: ${{ secrets.DRIVE_AUDIO_FOLDER_ID }}
        DRIVE_BACKGROUNDS_FOLDER_ID: ${{ secrets.DRIVE_BACKGROUNDS_FOLDER_ID }}
        
        # --- BRANCH-BASED PUBLISHING TOGGLES ---
        # Only Publish on Main Branch. dev branch remains safe (False)
        ENABLE_PUBLISH_YOUTUBE: ${{ (github.ref == 'refs/heads/main' && 'true') || 'false' }}
        ENABLE_PUBLISH_INSTAGRAM: ${{ (github.ref == 'refs/heads/main' && 'true') || 'false' }}
        ENABLE_PUBLISH_FACEBOOK: ${{ (github.ref == 'refs/heads/main' && 'true') || 'false' }}
        
        # Configuration
        TIMEZONE: "Asia/Kolkata"
        LOG_LEVEL: "INFO"
        
      run: |
        echo "🔍 Configuration Debug Information:"
        echo "Branch: ${{ github.ref }}"
        echo "ENABLE_PUBLISH_YOUTUBE: $ENABLE_PUBLISH_YOUTUBE"
        echo "ENABLE_PUBLISH_INSTAGRAM: $ENABLE_PUBLISH_INSTAGRAM"
        echo "ENABLE_PUBLISH_FACEBOOK: $ENABLE_PUBLISH_FACEBOOK"
        python debug_config.py

    - name: Execute Automated Pipeline
      env:
        # API Keys from GitHub Secrets
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        
        # YouTube Credentials
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        
        # Facebook & Instagram Credentials
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

        # Cloudinary Credentials (For stable Instagram posting)
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        
        # Database
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

        # LLM Configuration
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        
        # Google Drive Assets
        DRIVE_AUDIO_FOLDER_ID: ${{ secrets.DRIVE_AUDIO_FOLDER_ID }}
        DRIVE_BACKGROUNDS_FOLDER_ID: ${{ secrets.DRIVE_BACKGROUNDS_FOLDER_ID }}
        
        # --- BRANCH-BASED PUBLISHING TOGGLES ---
        # Only Publish on Main Branch. dev branch remains safe (False)
        ENABLE_PUBLISH_YOUTUBE: ${{ (github.ref == 'refs/heads/main' && 'true') || 'false' }}
        ENABLE_PUBLISH_INSTAGRAM: ${{ (github.ref == 'refs/heads/main' && 'true') || 'false' }}
        ENABLE_PUBLISH_FACEBOOK: ${{ (github.ref == 'refs/heads/main' && 'true') || 'false' }}
        
        # Configuration
        TIMEZONE: "Asia/Kolkata"
        LOG_LEVEL: "INFO"
        
      run: |
        HOUR=$(date +%H)
        echo "Current UTC Hour: $HOUR"
        echo "Publishing Status: YouTube=$ENABLE_PUBLISH_YOUTUBE, Instagram=$ENABLE_PUBLISH_INSTAGRAM, Facebook=$ENABLE_PUBLISH_FACEBOOK"
        
        # 1. Check if we should run the Bulletin (Existing System)
        # UTC: 01, 05, 09, 13, 17 (corresponds to 06:30, 10:30, 14:30, 18:30, 22:30 IST)
        if [[ "$HOUR" == "01" || "$HOUR" == "05" || "$HOUR" == "09" || "$HOUR" == "13" || "$HOUR" == "17" ]]; then
          echo "🚀 Running Bulletin Pipeline (main.py)..."
          python main.py
        fi
        
        # 2. Check if we should run the Viral Niche Pipeline
        # Mapping UTC hours to Categories
        CATEGORY=""
        case "$HOUR" in
          "02"|"07"|"12") CATEGORY="movies" ;;
          "03"|"08"|"14") CATEGORY="general" ;;
          "04"|"09"|"15") CATEGORY="india" ;;
          "05"|"10"|"16") CATEGORY="cricket" ;;
        esac
        
        if [ ! -z "$CATEGORY" ]; then
          echo "🎬 Running Viral $CATEGORY Pipeline (pipeline_viral.py)..."
          python pipeline_viral.py --category "$CATEGORY"
        else
          echo "ℹ️ No Viral Niche post scheduled for this hour."
        fi

    - name: Upload Generated Videos and Logs
      if: always()  # Run even if previous steps fail
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-outputs-${{ github.run_id }}
        path: |
          output/videos/*.mp4
          logs/*.log
          PIPELINE_STATUS.md
        retention-days: 7
        if-no-files-found: warn

    - name: Send Email Alert on Failure
      if: failure()
      continue-on-error: true  # Don't fail workflow if email fails
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.MAIL_SERVER }}
        server_port: ${{ secrets.MAIL_PORT }}
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "🚨 Social Media Agent Failure: ${{ github.run_id }}"
        to: ${{ secrets.ALERT_RECIPIENT }}
        from: "Social Media Automation Bot"
        body: |
          The Social Media Agent encountered a failure.
          
          Branch: ${{ github.ref }}
          Category Logic Triggered at Hour: $(date +%H)
          
          View Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
